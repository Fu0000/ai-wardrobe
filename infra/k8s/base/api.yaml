apiVersion: v1
kind: Service
metadata:
  name: ai-wardrobe-api
  namespace: ai-wardrobe
  labels:
    app.kubernetes.io/name: ai-wardrobe-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-wardrobe-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-wardrobe-api
  namespace: ai-wardrobe
  labels:
    app.kubernetes.io/name: ai-wardrobe-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-wardrobe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-wardrobe-api
        app.kubernetes.io/part-of: ai-wardrobe
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ai-wardrobe-registry
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: AIW_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-wardrobe-config
            - secretRef:
                name: ai-wardrobe-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data-ca
              mountPath: /var/run/secrets/ai-wardrobe
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: data-ca
          secret:
            secretName: ai-wardrobe-data-ca
            defaultMode: 0444
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-wardrobe-api
  namespace: ai-wardrobe
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-wardrobe-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-wardrobe-api
  namespace: ai-wardrobe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-wardrobe-api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
