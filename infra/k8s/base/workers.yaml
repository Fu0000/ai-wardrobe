apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-wardrobe-beat
  namespace: ai-wardrobe
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-wardrobe-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-wardrobe-beat
        app.kubernetes.io/part-of: ai-wardrobe
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ai-wardrobe-registry
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          image: AIW_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command:
            - celery
          args:
            - -A
            - app.worker.celery_app:celery_app
            - beat
            - --loglevel=INFO
            - --schedule=/tmp/celerybeat-schedule
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: ai-wardrobe-config
            - secretRef:
                name: ai-wardrobe-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
