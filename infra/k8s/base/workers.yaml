apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-wardrobe-worker-fast
  namespace: ai-wardrobe
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-wardrobe-worker-fast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-wardrobe-worker-fast
        app.kubernetes.io/part-of: ai-wardrobe
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      imagePullSecrets:
        - name: ai-wardrobe-registry
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: AIW_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command:
            - celery
          args:
            - -A
            - app.worker.celery_app:celery_app
            - worker
            - --queues=ai_fast
            - --loglevel=INFO
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: ai-wardrobe-config
            - secretRef:
                name: ai-wardrobe-secrets
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
