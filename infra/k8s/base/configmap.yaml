apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-wardrobe-config
  namespace: ai-wardrobe
data:
  AIW_ENVIRONMENT: production
  AIW_DEBUG: "false"
  AIW_LOG_LEVEL: INFO
  AIW_EXPOSE_API_DOCS: "false"
  AIW_WECHAT_LOGIN_ENABLED: "true"
  AIW_OPENAI_ENABLED: "true"
  AIW_COS_ENABLED: "true"
  AIW_RATE_LIMIT_ENABLED: "true"
  AIW_CORS_ORIGINS: "[]"
  AIW_TRUSTED_PROXY_CIDRS: "[]"
  AIW_MAX_JSON_BODY_BYTES: "1048576"
  AIW_READINESS_TIMEOUT_SECONDS: "2"
  AIW_OTEL_ENABLED: "true"
  AIW_OTEL_SERVICE_NAME: ai-wardrobe-api
  AIW_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  AIW_OTEL_SAMPLE_RATIO: "0.2"
  AIW_OTEL_EXPORT_TIMEOUT_SECONDS: "5"
  AIW_OTEL_METRICS_EXPORT_INTERVAL_SECONDS: "30"
  AIW_AI_CANARY_PERCENTAGE: "0"
  AIW_OUTBOX_WORKER_ID: staging-dispatcher
  AIW_OUTBOX_BATCH_SIZE: "50"
  AIW_OUTBOX_LOCK_TIMEOUT_SECONDS: "300"
  AIW_OUTBOX_DISPATCH_INTERVAL_SECONDS: "5"
