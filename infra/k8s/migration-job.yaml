apiVersion: batch/v1
kind: Job
metadata:
  name: ai-wardrobe-migrate-${AIW_DEPLOYMENT_ID}
  namespace: ai-wardrobe
  labels:
    app.kubernetes.io/name: ai-wardrobe-migrate
    app.kubernetes.io/part-of: ai-wardrobe
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-wardrobe-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ai-wardrobe-registry
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ${AIW_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - alembic
          args:
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: ai-wardrobe-config
            - secretRef:
                name: ai-wardrobe-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data-ca
              mountPath: /var/run/secrets/ai-wardrobe
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data-ca
          secret:
            secretName: ai-wardrobe-data-ca
            defaultMode: 0444
