apiVersion: v1
kind: Secret
metadata:
  name: ai-wardrobe-secrets
  namespace: ai-wardrobe
type: Opaque
stringData:
  AIW_DATABASE_URL: postgresql+psycopg://replace-me
  AIW_REDIS_URL: redis://replace-me
  AIW_SECRET_KEY: replace-with-32-plus-random-characters
  AIW_ACCESS_TOKEN_KEY: replace-with-32-plus-random-characters
  AIW_IDENTITY_HMAC_KEY: replace-with-32-plus-random-characters
  AIW_IDENTITY_ENCRYPTION_KEY: replace-with-fernet-key
  AIW_WECHAT_APP_ID: replace-me
  AIW_WECHAT_APP_SECRET: replace-me
  AIW_OPENAI_API_KEY: replace-me
  AIW_COS_BUCKET: replace-me
  AIW_COS_SECRET_ID: replace-me
  AIW_COS_SECRET_KEY: replace-me
  AIW_COS_SECURITY_TOKEN: ""
  AIW_COS_UPLOAD_SECRET_ID: replace-with-separate-upload-identity
  AIW_COS_UPLOAD_SECRET_KEY: replace-me
  AIW_COS_UPLOAD_SECURITY_TOKEN: ""
