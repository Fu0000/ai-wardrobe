apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-wardrobe-api
  namespace: ai-wardrobe
  labels:
    app.kubernetes.io/name: ai-wardrobe-api
    app.kubernetes.io/part-of: ai-wardrobe
  annotations:
    kubernetes.io/ingress.class: qcloud
    kubernetes.io/ingress.existLbId: AIW_STAGING_EDGE_CLB_ID_PLACEHOLDER
    ingress.cloud.tencent.com/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    ingress.cloud.tencent.com/certificate: '[{"hosts":["AIW_STAGING_API_HOST_PLACEHOLDER"],"qcloud_cert_id":["AIW_STAGING_TLS_CERT_ID_PLACEHOLDER"]}]'
    ingress.cloud.tencent.com/auto-rewrite: "true"
    ingress.cloud.tencent.com/auto-rewrite-code: '{"defaultRewriteCode":307}'
    ingress.cloud.tencent.com/deletion-protection: "true"
spec:
  rules:
    - host: AIW_STAGING_API_HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-wardrobe-api
                port:
                  number: 80
