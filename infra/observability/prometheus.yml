global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: ai-wardrobe-otel
    static_configs:
      - targets:
          - otel-collector:9464

  - job_name: ai-wardrobe-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: ai-wardrobe-redis
    static_configs:
      - targets:
          - redis-exporter:9121
