groups:
  - name: ai-wardrobe-service
    rules:
      - alert: AIWardrobePostgreSQLUnavailable
        expr: |
          pg_up == 0
          or absent(pg_up)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL readiness is unavailable
          runbook: Check exporter health, database connectivity, credentials, and the latest migration.

      - alert: AIWardrobePostgreSQLConnectionsHigh
        expr: |
          (
            sum(pg_stat_activity_count)
            /
            clamp_min(max(pg_settings_max_connections), 1)
          ) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL connection usage exceeds 80%
          runbook: Split activity by state, find long transactions, and check application pool saturation.

      - alert: AIWardrobeRedisUnavailable
        expr: |
          redis_up == 0
          or absent(redis_up)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Redis readiness is unavailable
          runbook: Check exporter health, Redis connectivity, credentials, and latency.

      - alert: AIWardrobeRedisConnectionsHigh
        expr: |
          (
            redis_connected_clients
            /
            clamp_min(redis_config_maxclients, 1)
          ) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Redis client connection usage exceeds 80%
          runbook: Inspect client list, application pools, blocked clients, and stale workers.

      - alert: AIWardrobeRedisMemoryHigh
        expr: |
          (
            redis_memory_used_bytes
            /
            clamp_min(redis_memory_max_bytes, 1)
          ) > 0.80
          and on(instance) redis_memory_max_bytes > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Redis memory usage exceeds 80% of configured maximum
          runbook: Inspect key growth, queue backlog, TTL coverage, and noeviction write failures.

      - alert: AIWardrobeHigh5xxRate
        expr: |
          (
            sum(rate(aiw_http_server_requests_total{http_response_status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(aiw_http_server_requests_total[5m])), 0.001)
          ) > 0.02
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: API 5xx rate exceeds 2%
          runbook: Check Trace ID samples, readiness dependencies, and the latest deployment.

      - alert: AIWardrobeApiP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(aiw_http_server_duration_milliseconds_bucket[10m]))
          ) > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: API P95 latency exceeds 1 second
          runbook: Split by http_route and inspect database, Redis, and provider child spans.

      - alert: AIWardrobeWorkerFailureSpike
        expr: |
          sum(
            rate(
              aiw_worker_executions_total{
                aiw_outcome=~"error|failed_final|timed_out"
              }[10m]
            )
          ) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Background worker failures are increasing
          runbook: Split by messaging_operation_name and inspect the linked job trace.

      - alert: AIWardrobeAIProviderFailureRateHigh
        expr: |
          (
            sum(rate(aiw_ai_provider_attempts_total{aiw_outcome!="success"}[10m]))
            /
            clamp_min(sum(rate(aiw_ai_provider_attempts_total[10m])), 0.001)
          ) > 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: AI provider failure rate exceeds 10%
          runbook: Split by provider, model, operation, and outcome before changing fallback policy.

      - alert: AIWardrobeOutboxPublishFailures
        expr: |
          sum(rate(aiw_outbox_publishes_total{aiw_outcome="failed"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Transactional Outbox events are failing to publish
          runbook: Check Redis/Celery connectivity and Outbox locked or failed rows.

      - alert: AIWardrobeOutboxBacklogOld
        expr: aiw_outbox_oldest_pending_age_seconds > 120
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Oldest pending Outbox event exceeds 2 minutes
          runbook: Check dispatcher liveness, Redis connectivity, and Celery queue consumers.

      - alert: AIWardrobeOutboxDeadLetter
        expr: aiw_outbox_dead_letter > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Transactional Outbox events exhausted retries and were dead-lettered
          runbook: >-
            Dead-lettered events are never retried and their business effect is lost.
            Inspect last_error and event_type on DEAD_LETTER rows, fix the publisher
            or payload, then requeue deliberately by resetting status to PENDING.

      - alert: AIWardrobeDeletionFailures
        expr: |
          sum(
            rate(
              aiw_worker_executions_total{
                messaging_operation_name="celery run_deletion",
                aiw_outcome=~"error|failed_final|timed_out"
              }[15m]
            )
          ) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Privacy deletion jobs are failing
          runbook: Check COS deletion errors first, then DB transaction and fenced execution state.

      - alert: AIWardrobeOrphanUploadCleanupFailures
        expr: |
          sum(
            increase(
              aiw_assets_orphan_upload_cleanup_total{
                aiw_outcome="retryable_failure"
              }[15m]
            )
          ) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Orphan upload cleanup cannot delete objects
          runbook: Check COS credentials and availability, then inspect UPLOAD_EXPIRED rows.
