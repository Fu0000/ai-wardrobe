name: Deploy Staging

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: ai-wardrobe-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    name: Build, migrate, and deploy
    runs-on:
      - self-hosted
      - linux
      - x64
      - ai-wardrobe-staging
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Resolve immutable lowercase image reference
        run: |
          test "$DEPLOY_SHA" = "$(git rev-parse HEAD)"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          image_owner="$(
            printf '%s' "$GITHUB_REPOSITORY_OWNER" \
              | tr '[:upper:]' '[:lower:]'
          )"
          [[ "$image_owner" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          echo "IMAGE=ghcr.io/${image_owner}/ai-wardrobe-api:${DEPLOY_SHA}" \
            >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.35.0

      - name: Configure cluster access
        env:
          KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          printf '%s' "$KUBECONFIG_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Validate staging prerequisites
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          TRUSTED_PROXY_CIDRS_JSON: ${{ vars.STAGING_TRUSTED_PROXY_CIDRS_JSON }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_API_HOST: ${{ vars.STAGING_API_HOST }}
          STAGING_TLS_CERT_ID: ${{ vars.STAGING_TLS_CERT_ID }}
          STAGING_EDGE_CLB_ID: ${{ vars.STAGING_EDGE_CLB_ID }}
        run: |
          kubectl apply -f infra/k8s/base/namespace.yaml
          kubectl apply -f infra/k8s/base/configmap.yaml
          kubectl -n ai-wardrobe get secret ai-wardrobe-secrets
          for ca_key in postgresql-ca.pem redis-ca.pem; do
            escaped_key="${ca_key//./\\.}"
            kubectl -n ai-wardrobe get secret ai-wardrobe-data-ca \
              --output "jsonpath={.data.${escaped_key}}" \
              | grep -q .
          done
          test -n "$GHCR_PULL_USERNAME"
          test -n "$GHCR_PULL_TOKEN"
          test -n "$TRUSTED_PROXY_CIDRS_JSON"
          test -n "$STAGING_API_BASE_URL"
          test -n "$STAGING_API_HOST"
          test -n "$STAGING_TLS_CERT_ID"
          test -n "$STAGING_EDGE_CLB_ID"
          python - <<'PY'
          import ipaddress
          import json
          import os

          cidrs = json.loads(os.environ["TRUSTED_PROXY_CIDRS_JSON"])
          if not isinstance(cidrs, list) or not cidrs:
              raise SystemExit("STAGING_TRUSTED_PROXY_CIDRS_JSON must be a non-empty JSON list")
          for cidr in cidrs:
              if not isinstance(cidr, str):
                  raise SystemExit("every trusted proxy CIDR must be a string")
              network = ipaddress.ip_network(cidr, strict=False)
              if network.prefixlen == 0:
                  raise SystemExit("trusted proxy CIDRs must not trust the entire address space")
          PY
          kubectl -n ai-wardrobe patch configmap ai-wardrobe-config \
            --type merge \
            --patch "$(jq -cn \
              --arg cidrs "$TRUSTED_PROXY_CIDRS_JSON" \
              '{data:{AIW_TRUSTED_PROXY_CIDRS:$cidrs}}')"
          kubectl -n ai-wardrobe create secret docker-registry ai-wardrobe-registry \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_PULL_USERNAME" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client \
            --output=yaml \
            | kubectl apply -f -

      - name: Run forward-only migrations
        env:
          AIW_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          AIW_IMAGE: ${{ env.IMAGE }}
        run: |
          sed \
            -e "s|\${AIW_DEPLOYMENT_ID}|${AIW_DEPLOYMENT_ID}|g" \
            -e "s|\${AIW_IMAGE}|${AIW_IMAGE}|g" \
            infra/k8s/migration-job.yaml \
            | kubectl apply -f -
          migration_job="ai-wardrobe-migrate-${AIW_DEPLOYMENT_ID}"
          if ! kubectl -n ai-wardrobe wait \
            --for=condition=complete \
            "job/${migration_job}" \
            --timeout=10m; then
            kubectl -n ai-wardrobe logs "job/${migration_job}" --all-containers
            exit 1
          fi

      - name: Render and deploy immutable Staging manifests
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_API_HOST: ${{ vars.STAGING_API_HOST }}
          STAGING_TLS_CERT_ID: ${{ vars.STAGING_TLS_CERT_ID }}
          STAGING_EDGE_CLB_ID: ${{ vars.STAGING_EDGE_CLB_ID }}
        run: |
          controller_version="$(
            kubectl -n kube-system get configmap tke-ingress-controller-config \
              --output=jsonpath='{.data.VERSION}'
          )"
          test -n "$controller_version"
          install -d -m 700 "$RUNNER_TEMP/aiw-staging-manifests"
          kubectl kustomize infra/k8s/staging \
            > "$RUNNER_TEMP/aiw-staging-manifests/template.yaml"
          chmod 600 "$RUNNER_TEMP/aiw-staging-manifests/template.yaml"
          python backend/scripts/deployment/staging_manifests.py \
            --input "$RUNNER_TEMP/aiw-staging-manifests/template.yaml" \
            --output "$RUNNER_TEMP/aiw-staging-manifests/rendered.yaml" \
            --image "$IMAGE" \
            --api-host "$STAGING_API_HOST" \
            --api-base-url "$STAGING_API_BASE_URL" \
            --tls-certificate-id "$STAGING_TLS_CERT_ID" \
            --edge-clb-id "$STAGING_EDGE_CLB_ID" \
            --ingress-controller-version "$controller_version"
          kubectl apply \
            --dry-run=server \
            -f "$RUNNER_TEMP/aiw-staging-manifests/rendered.yaml"
          kubectl apply \
            -f "$RUNNER_TEMP/aiw-staging-manifests/rendered.yaml"

      - name: Wait for safe rollout
        run: |
          for deployment in \
            ai-wardrobe-api \
            ai-wardrobe-worker-fast \
            ai-wardrobe-worker-image \
            ai-wardrobe-worker-media \
            ai-wardrobe-worker-maintenance \
            ai-wardrobe-beat; do
            kubectl -n ai-wardrobe rollout status \
              "deployment/${deployment}" \
              --timeout=10m
          done

      - name: Verify fixed CLB and public DNS binding
        env:
          STAGING_API_HOST: ${{ vars.STAGING_API_HOST }}
          STAGING_EDGE_CLB_ID: ${{ vars.STAGING_EDGE_CLB_ID }}
        run: |
          ingress_address=""
          observed_clb_id=""
          for _ in $(seq 1 60); do
            ingress_address="$(
              kubectl -n ai-wardrobe get ingress ai-wardrobe-api \
                --output=jsonpath='{.status.loadBalancer.ingress[0].ip}{.status.loadBalancer.ingress[0].hostname}'
            )"
            observed_clb_id="$(
              kubectl -n ai-wardrobe get ingress ai-wardrobe-api \
                --output=jsonpath='{.metadata.annotations.kubernetes\.io/ingress\.qcloud-loadbalance-id}'
            )"
            if [ -n "$ingress_address" ] && [ -n "$observed_clb_id" ]; then
              break
            fi
            sleep 10
          done
          test "$observed_clb_id" = "$STAGING_EDGE_CLB_ID"
          test -n "$ingress_address"
          python - "$STAGING_API_HOST" "$ingress_address" <<'PY'
          import ipaddress
          import socket
          import sys

          host, ingress_address = sys.argv[1:]
          host_addresses = {
              result[4][0]
              for result in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
          }
          try:
              expected_addresses = {str(ipaddress.ip_address(ingress_address))}
          except ValueError:
              expected_addresses = {
                  result[4][0]
                  for result in socket.getaddrinfo(
                      ingress_address,
                      443,
                      type=socket.SOCK_STREAM,
                  )
              }
          if host_addresses.isdisjoint(expected_addresses):
              raise SystemExit("Staging API DNS does not resolve to the Ingress CLB")
          PY

      - name: HTTPS and redirect smoke test
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_API_HOST: ${{ vars.STAGING_API_HOST }}
        run: |
          headers="$RUNNER_TEMP/aiw-staging-manifests/headers.txt"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --proto '=https' \
            --tlsv1.2 \
            --dump-header "$headers" \
            "${STAGING_API_BASE_URL%/}/health/ready"
          grep -qi '^strict-transport-security:' "$headers"
          read -r redirect_code redirect_url < <(
            curl \
              --silent \
              --show-error \
              --max-time 15 \
              --output /dev/null \
              --write-out '%{http_code} %{redirect_url}\n' \
              "http://${STAGING_API_HOST}/health/ready"
          )
          test "$redirect_code" = "307"
          test "$redirect_url" = "${STAGING_API_BASE_URL%/}/health/ready"

      - name: Remove deployment credentials and rendered manifests
        if: ${{ always() }}
        run: |
          rm -f \
            "$RUNNER_TEMP/kubeconfig" \
            "$RUNNER_TEMP/aiw-staging-manifests/template.yaml" \
            "$RUNNER_TEMP/aiw-staging-manifests/rendered.yaml" \
            "$RUNNER_TEMP/aiw-staging-manifests/headers.txt"
          rmdir "$RUNNER_TEMP/aiw-staging-manifests" 2>/dev/null || true
