[project]
name = "ai-wardrobe-api"
version = "0.1.0"
description = "AI Wardrobe modular monolith API and workers"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.18.5",
    "celery[redis]==5.6.3",
    "cos-python-sdk-v5==1.9.44",
    "cryptography==49.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "openai==2.46.0",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.4",
    "pyjwt==2.13.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "redis==6.4.0",
    "sqlalchemy==2.0.51",
    "structlog==26.1.0",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio>=1.3.0,<2",
    "ruff==0.16.0",
]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires disposable PostgreSQL and Redis services",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "B008",
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery.*", "qcloud_cos.*"]
ignore_missing_imports = true
